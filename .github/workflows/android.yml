name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Init submodules
        run: |
          # Replace SSH URLs with HTTPS in .gitmodules
          sed -i 's|git@github.com:|https://github.com/|g' .gitmodules
          sed -i 's|git://github.com|https://github.com|g' .gitmodules
          git submodule sync

          # Init all top-level submodules
          git submodule update --init --depth 1

          # Try to init nested submodules recursively, allow failures for missing URLs
          git submodule update --init --recursive --depth 1 || true

          # Manually clone submodules with missing .gitmodules entries
          if [ ! -d "mmd/third_party/bullet3/.git" ]; then
            git clone --depth 1 https://github.com/bulletphysics/bullet3.git mmd/third_party/bullet3 || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" "build-tools;35.0.0" "platforms;android-36"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Operit-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log