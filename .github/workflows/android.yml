name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Init submodules
        run: |
          # Replace SSH URLs with HTTPS in .gitmodules
          sed -i 's|git@github.com:|https://github.com/|g' .gitmodules
          sed -i 's|git://github.com|https://github.com|g' .gitmodules
          git submodule sync

          # Init individual submodules, allow failures for problematic ones
          for sub in \
            app/src/main/cpp/thirdparty/ncnn \
            app/src/main/cpp/thirdparty/sherpa-ncnn \
            fbx/third_party/ufbx \
            llama/third_party/llama.cpp \
            quickjs/thirdparty/quickjs; do
            git submodule update --init --depth 1 "$sub" || true
          done

          # Clone submodules with missing/problematic URLs manually
          git clone --depth 1 https://github.com/bulletphysics/bullet3.git mmd/third_party/bullet3 || true
          git clone --depth 1 https://github.com/AAswordman/OperitTerminalCore.git tools/hotbuild/OperitNightlyRelease || true

      - name: Patch source for CI build
        run: |
          # Comment out modules that need complex native builds or missing deps
          sed -i 's/^include(":dragonbones")$/\/\/include(":dragonbones")/' settings.gradle.kts
          sed -i 's/^include(":mnn")$/\/\/include(":mnn")/' settings.gradle.kts
          sed -i 's/^include(":llama")$/\/\/include(":llama")/' settings.gradle.kts
          sed -i 's/^include(":mmd")$/\/\/include(":mmd")/' settings.gradle.kts
          sed -i 's/^include(":fbx")$/\/\/include(":fbx")/' settings.gradle.kts
          sed -i 's/^include(":terminal")$/\/\/include(":terminal")/' settings.gradle.kts
          sed -i 's/^include(":showerclient")$/\/\/include(":showerclient")/' settings.gradle.kts
          sed -i 's/^include(":quickjs")$/\/\/include(":quickjs")/' settings.gradle.kts

          # Remove kapt block for JDK compatibility
          sed -i '/kapt {/,/}/d' app/build.gradle.kts || true

          # Disable kapt incremental
          grep -q 'kapt.incremental' gradle.properties || echo 'kapt.incremental.apt=false' >> gradle.properties

          # Remove local aar/jar fileTree dependencies
          sed -i '/fileTree.*libs.*aar.*jar/d' app/build.gradle.kts

          # Comment out FFmpegKit imports
          for f in $(grep -rl 'import com\.arthenica' app/src/ 2>/dev/null | grep -v '.class'); do
            sed -i 's|^import com\.arthenica\.\(.*\)|// import com.arthenica.\1 // ffmpeg removed|' "$f"
          done

          # Stub out FFmpegKit/FFprobeKit/FFmpegKitConfig references in Kotlin files
          for f in $(grep -rl 'FFmpegKit\|FFprobeKit\|FFmpegKitConfig' app/src/ 2>/dev/null | grep '\.kt$'); do
            sed -i 's|FFmpegKit\.\(.*\)|/* FFmpegKit.\1 */|g' "$f"
            sed -i 's|FFprobeKit\.\(.*\)|/* FFprobeKit.\1 */|g' "$f"
            sed -i 's|FFmpegKitConfig\.\(.*\)|/* FFmpegKitConfig.\1 */|g' "$f"
          done

          # Stub out Terminal-related code in ToolboxScreen.kt
          TOOLBOX_FILE="app/src/main/java/com/ai/assistance/operit/ui/features/toolbox/screens/ToolboxScreen.kt"
          if [ -f "$TOOLBOX_FILE" ]; then
            sed -i 's|^import com\.ai\.assistance\.operit\.terminal\.main\.TerminalScreen as TerminalViewScreen|// import com.ai.assistance.operit.terminal.main.TerminalScreen as TerminalViewScreen|' "$TOOLBOX_FILE"
            sed -i 's|^import com\.ai\.assistance\.operit\.terminal\.TerminalManager|// import com.ai.assistance.operit.terminal.TerminalManager|' "$TOOLBOX_FILE"
            sed -i 's|^import com\.ai\.assistance\.operit\.terminal\.rememberTerminalEnv|// import com.ai.assistance.operit.terminal.rememberTerminalEnv|' "$TOOLBOX_FILE"
            sed -i 's|val terminalManager = remember { TerminalManager.getInstance(context) }|// terminalManager stubbed|' "$TOOLBOX_FILE"
            sed -i 's|val terminalEnv = rememberTerminalEnv(terminalManager = terminalManager, forceShowSetup = forceShowSetup)|// terminalEnv stubbed|' "$TOOLBOX_FILE"
            sed -i 's|TerminalViewScreen(env = terminalEnv)|Text("Terminal unavailable")|' "$TOOLBOX_FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" "build-tools;35.0.0" "platforms;android-36"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Operit-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
